<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0C0C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>이안의 일잘러 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0A0C0C; --side:#060707; --card:#131716; --card2:#1A1F1E; --input:#0E1211;
  --ink:#E8EEEC; --muted:#8C9794; --faint:#5A6462;
  --line:#242B29; --line2:#1C2120;
  --accent:#00CCAA; --accent-ink:#00B898; --on-accent:#03201A; --accent-soft:rgba(0,204,170,.13);
  --amber:#F0B45A; --amber-soft:rgba(240,180,90,.14); --red:#FF6B5E; --red-soft:rgba(255,107,94,.14);
  --blue:#6FA8FF; --blue-soft:rgba(111,168,255,.14); --violet:#9B7BEA;
  --sunk:#0F1211; --input-f:#101514; --modal:#151A19; --hover-cell:#1A201F; --toast:#1E2624; --hover:#202726; --chipbg:#222927; --seg-on:#2A3331; --line-strong:#36403E; --other-dn:#3A4240; --cb-border:#46504E; --ph:#4F5957; --p-low:#56605E;
  --g-ink:#A9C8FF; --banner-ink:#F2CC93; --nav-m:rgba(6,7,7,.94); --ot-in:rgba(0,0,0,.35); --ot-in-f:rgba(0,0,0,.45); --ot-ph:rgba(232,238,236,.4); --ghost-h:rgba(255,255,255,.05); --mixto:white;
  --radius:14px; --shadow:0 1px 0 rgba(255,255,255,.02) inset,0 8px 24px rgba(0,0,0,.35);
}
html[data-theme=light]{
  color-scheme:light;
  --bg:#F2F5F4; --side:#E7EDEB; --card:#FFFFFF; --card2:#F5F8F7; --input:#FAFCFB;
  --ink:#121716; --muted:#5D6966; --faint:#99A4A1;
  --line:#DCE3E1; --line2:#EBF0EE;
  --accent:#00A88C; --accent-ink:#008F77; --on-accent:#FFFFFF; --accent-soft:rgba(0,168,140,.12);
  --amber:#B5741C; --amber-soft:rgba(232,160,60,.16); --red:#D2463A; --red-soft:rgba(210,70,58,.11);
  --blue:#2F6FD6; --blue-soft:rgba(47,111,214,.11); --violet:#7A5BD0;
  --shadow:0 1px 2px rgba(18,23,22,.04),0 4px 16px rgba(18,23,22,.05);
  --sunk:#F4F6F5; --input-f:#FFFFFF; --modal:#FFFFFF; --hover-cell:#F2F7F5; --toast:#1B2221; --hover:#EFF4F2; --chipbg:#EBF0EE; --seg-on:#FFFFFF; --line-strong:#C6D0CD; --other-dn:#C3CBC8; --cb-border:#B4BFBC; --ph:#A9B3B0; --p-low:#B4BDBA;
  --g-ink:#2559AE; --banner-ink:#7A4D12; --nav-m:rgba(240,244,243,.95); --ot-in:rgba(255,255,255,.75); --ot-in-f:#FFFFFF; --ot-ph:rgba(18,23,22,.38); --ghost-h:rgba(0,0,0,.04); --mixto:black;
}
html[data-theme=light] .toast{color:#EEF3F1}
html[data-theme=light] .modal-bg{background:rgba(18,23,22,.38)}
html[data-theme=light] .att .big{box-shadow:0 6px 16px rgba(0,168,140,.22)}
.themebtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card2);display:inline-grid;place-items:center;color:var(--ink);padding:0}
.themebtn:hover{border-color:var(--line-strong)}
.themebtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.topright{display:flex;align-items:center;gap:12px}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* layout */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
button,a,input,select,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.side{position:sticky;top:0;align-self:start;height:100vh;padding:26px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;background:var(--side)}
.brand{padding:0 8px}
.brand img{display:block;width:132px;height:auto;margin-bottom:10px}
.brand .t{font-size:15px;font-weight:600;letter-spacing:-.2px}
.brand .s{font-size:12px;color:var(--muted);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.nav a:hover{background:rgba(0,204,170,.08)}
.nav a.on{background:var(--accent);color:var(--on-accent)}
.nav a.on svg{opacity:1}
.mshare{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0 4px;background:rgba(0,204,170,.05)}
.mshare-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:8px}
.mshare-h .hint{font-size:12px}
.mshare a.btn{text-decoration:none;color:inherit}
textarea.msum{min-height:360px;line-height:1.7}
.mold{margin-top:14px;border:1px dashed var(--line);border-radius:12px;padding:10px 14px}
.mold summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
.moldacts{display:flex;flex-direction:column;gap:4px;font-size:14px}
.studypane{grid-column:2;grid-row:1;display:flex;flex-direction:column;height:100vh;position:sticky;top:0;min-width:0}
.studypane[hidden]{display:none}
.studybar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.studybar b{color:var(--ink);font-size:14px;margin-right:auto}
.studybar a.btn{text-decoration:none;color:inherit}
.studypane iframe{flex:1;width:100%;border:0;background:var(--bg,transparent)}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px;display:flex;flex-direction:column;gap:6px}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.sync.busy i{background:var(--amber)}
.sync.local i{background:var(--faint)}
.sync.err i{background:var(--red)}

.main{padding:26px 34px 80px;max-width:1240px;width:100%;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.hello{font-size:14px;color:var(--muted)}
.hello b{color:var(--ink);font-weight:600}
.prob{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.prob .bar{width:140px;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.prob .bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.msync{display:none;font-size:12px;color:var(--muted)}
.mlogo{display:none;height:18px;width:auto}
.banner{background:var(--amber-soft);color:var(--banner-ink);border:1px solid rgba(240,180,90,.22);border-radius:10px;padding:9px 14px;font-size:13px;margin-bottom:16px}

h1.page{font-size:26px;margin:0;letter-spacing:-.6px;font-weight:700}
.pagehead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pagehead .grow{flex:1}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;box-shadow:var(--shadow)}
.card h3{margin:0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .sub{font-weight:400;color:var(--muted);font-size:13px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.hint{color:var(--muted);font-size:13px}
.empty{color:var(--faint);font-size:13px;padding:6px 0}

/* buttons */
.btn{border:1px solid var(--line);background:var(--card2);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--line-strong);background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.pri:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--ghost-h)}
.btn.sm{padding:4px 9px;font-size:12px}
.icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card2);display:inline-grid;place-items:center;font-size:16px;line-height:1}
.icon-btn:hover{background:var(--hover);border-color:var(--line-strong)}
.x{border:0;background:transparent;color:var(--faint);font-size:15px;padding:2px 6px;border-radius:6px;line-height:1}
.x:hover{color:var(--red);background:var(--red-soft)}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{white-space:nowrap;flex:none;border:0;background:transparent;padding:6px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--seg-on);color:var(--ink)}

/* fields */
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{border:1px solid var(--line);background:var(--input);border-radius:9px;padding:8px 10px;font-size:14px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--input-f);box-shadow:0 0 0 3px rgba(0,204,170,.18)}
input::placeholder,textarea::placeholder{color:var(--ph)}
select option{background:var(--card);color:var(--ink)}
textarea{resize:none;min-height:64px;line-height:1.6;overflow:hidden}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 5px}
label.f:first-child{margin-top:0}
.row{display:flex;gap:8px;align-items:center}
.row > *{min-width:0}
.addrow{display:flex;gap:6px;margin-top:10px}
.addrow input[type=text]{flex:1}
.addrow select{width:auto}

/* day header */
.dayhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.dayhead h1{min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.grey{background:var(--chipbg);color:var(--muted)}
.onething{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,rgba(0,204,170,.20),rgba(0,204,170,.04) 70%);border:1px solid rgba(0,204,170,.35);color:var(--ink);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px}
.onething .lab{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap;letter-spacing:.2px}
.onething input{background:var(--ot-in);border:1px solid rgba(0,204,170,.25);color:var(--ink);font-size:16px;font-weight:500}
.onething input::placeholder{color:var(--ot-ph)}
.onething input:focus{background:var(--ot-in-f);border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,204,170,.15)}

/* attendance */
.att{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.att .slot{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:12px}
.att .slot .k{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.att .slot .v{font-size:24px;font-weight:600;letter-spacing:-.5px}
.att .big{width:100%;padding:12px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 0 rgba(0,204,170,0),0 6px 18px rgba(0,204,170,.22);font-weight:600;font-size:15px}
.att .big.out{background:var(--ink);color:var(--bg);box-shadow:none}
.att .big:disabled{background:var(--line);color:var(--faint);cursor:default;box-shadow:none}
.att input[type=time]{font-size:20px;font-weight:600;padding:4px 8px;background:transparent;border-color:transparent}
.att input[type=time]:hover{border-color:var(--line)}
.top3wrap{margin:-4px 0 18px}
.top3head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 8px;font-size:14px}
.top3head .btn{margin-left:auto}
.top3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tp{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 8px;box-shadow:var(--shadow);transition:border-color .15s}
.tp:focus-within{border-color:var(--accent)}
.tp .no{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--accent-soft);color:var(--accent)}
.tp input[type=text]{flex:1;border:0;background:transparent;padding:6px 2px;font-size:15px;font-weight:500;box-shadow:none}
.tp input[type=text]:focus{box-shadow:none;background:transparent}
.tp .cb:disabled{opacity:.35;cursor:default}
.tp.done{background:var(--accent-soft);border-color:rgba(0,204,170,.35)}
.tp.done .no{background:var(--accent);color:var(--on-accent)}
.tp.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.att .eta{font-size:12.5px;color:var(--muted);margin-top:7px;text-align:center;line-height:1.45}
.att .eta .sep{display:none}
.att .eta .nw{display:block;white-space:nowrap}
.nw{white-space:nowrap}
.attfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.attfoot select{width:auto;padding:5px 8px;font-size:13px}

/* checklist & todos */
.progress{height:6px;background:var(--line2);border-radius:6px;overflow:hidden;margin:-2px 0 10px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.items{list-style:none;margin:0;padding:0}
.items li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line2)}
.items li:last-child{border-bottom:0}
.items li .tx{flex:1;min-width:0;word-break:break-word}
.items li.done .tx{color:var(--faint);text-decoration:line-through}
.cb{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:1.6px solid var(--cb-border);border-radius:6px;flex:none;display:grid;place-items:center;cursor:pointer;background:transparent;margin:0}
.cb:checked{background:var(--accent);border-color:var(--accent)}
.cb:checked::after{content:"";width:6px;height:10px;border:solid var(--on-accent);border-width:0 2.4px 2.4px 0;transform:rotate(45deg) translate(-1px,-1px)}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.pdot{width:8px;height:8px;border-radius:50%;flex:none}
.p-high{background:var(--red)} .p-mid{background:var(--amber)} .p-low{background:var(--p-low)}
.tag{font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--chipbg);color:var(--muted)}
.overdue{color:var(--red);font-weight:600}
.items li.todo{flex-wrap:wrap}
.subtoggle{border:0;background:var(--chipbg);color:var(--muted);font-size:11.5px;padding:2px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:3px}
.subtoggle:hover{color:var(--ink)}
.subtoggle.on{background:var(--accent-soft);color:var(--accent)}
.subtoggle.all b{color:var(--accent)}
.subbar{display:block;height:3px;max-width:140px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.subbar i{display:block;height:100%;background:var(--accent)}
.subs{flex-basis:100%;margin:6px 0 2px 38px;padding:4px 0 2px 12px;border-left:2px solid var(--line)}
.sub{display:flex;align-items:center;gap:9px;padding:5px 0}
.sub .stx{flex:1;min-width:0;font-size:14px;word-break:break-word}
.sub.done .stx{color:var(--faint);text-decoration:line-through}
.cb.sm{width:17px;height:17px;border-radius:5px}
.cb.sm:checked::after{width:4px;height:8px}
.subadd{display:flex;align-items:center;gap:8px;margin-top:2px}
.subadd .plus{width:17px;text-align:center;color:var(--accent);font-weight:700}
.subadd input[type=text]{border:0;border-bottom:1px dashed var(--line);border-radius:0;background:transparent;padding:6px 2px;font-size:14px}
.subadd input[type=text]:focus{box-shadow:none;border-bottom-color:var(--accent);background:transparent}
.items li.todo.done .subs{opacity:.7}
.duechips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tsec{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 2px}
.tsec:first-of-type{margin-top:0}
.tsec i{flex:1;height:1px;background:var(--line2)}
.tsec b{font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:0 6px;line-height:17px}
.tsec b:empty{display:none}
.tsec-tomorrow span{color:var(--blue)}
.mgrid{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:18px;align-items:start}
.mlist{position:sticky;top:18px;max-height:calc(100vh - 140px);overflow:auto;padding:14px}
.mgroup{font-size:12px;font-weight:700;color:var(--muted);margin:12px 4px 6px}
.mgroup:first-of-type{margin-top:4px}
.mitem{padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.mitem:hover{background:var(--hover)}
.mitem.on{background:var(--accent-soft);border-color:rgba(0,204,170,.35)}
.mitem .mt{font-weight:600;font-size:14.5px;margin-bottom:3px;word-break:break-word}
.mitem .mprev{font-size:12.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.okc{color:var(--accent);font-weight:600}
.mempty{min-height:200px;display:grid;place-items:center;text-align:center;line-height:1.8}
.mtop{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.mback{display:none}
.mtitle{font-size:22px !important;font-weight:700;border:0 !important;background:transparent !important;padding:6px 0 !important;box-shadow:none !important;letter-spacing:-.4px}
.mrow{gap:10px}
.mrow > div{flex:1}
.acts{display:flex;flex-direction:column;gap:6px}
.act{display:flex;align-items:flex-start;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card2)}
.act .abody{flex:1;min-width:0}
.act .atext{font-weight:500;word-break:break-word}
.act.done .atext{text-decoration:line-through;color:var(--faint)}
.actadd{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.actadd input[name=t]{flex:2;min-width:160px}
.actadd input[name=o]{flex:1;min-width:90px}
.actadd input[type=date]{width:auto}
.wheel-bg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.wheel{background:var(--modal);border:1px solid var(--line);border-radius:18px;width:360px;max-width:100%;padding:18px 16px 16px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.wlabel{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.wprev{font-size:19px;font-weight:700;text-align:center;margin:2px 0 12px;letter-spacing:-.3px}
.wcols{position:relative;display:flex;gap:2px;height:220px;user-select:none;-webkit-user-select:none}
.wcols::before{content:"";position:absolute;left:0;right:0;top:88px;height:44px;background:var(--accent-soft);border:1px solid rgba(0,204,170,.3);border-radius:11px;pointer-events:none}
.wcol{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding:88px 0;position:relative;z-index:1;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 32%,#000 68%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 32%,#000 68%,transparent 100%)}
.wcol::-webkit-scrollbar{display:none}
.wi{height:44px;line-height:44px;text-align:center;scroll-snap-align:center;font-size:18px;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.wi.sel{color:var(--ink);font-weight:700;font-size:20px}
.wcol.narrow{flex:.8}
.wquick{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.wactions{display:flex;gap:8px;margin-top:14px}
.wactions .btn{flex:1;justify-content:center;min-height:44px;font-size:15px}
input[type=date][readonly],input[type=time][readonly]{cursor:pointer}
body.login .side{display:none}
body.login .app{grid-template-columns:minmax(0,1fr)}
body.login .main{max-width:none}
.loginwrap{min-height:80vh;display:grid;place-items:center;padding:20px 0}
.logincard{width:100%;max-width:400px;padding:28px 24px}
.loginlogo{width:120px;height:auto;display:block;margin-bottom:12px}
input[type=email],input[type=password]{border:1px solid var(--line);background:var(--input);border-radius:9px;padding:10px 11px;font-size:15px;outline:none;width:100%}
input[type=email]:focus,input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,204,170,.18)}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:3px}

/* events */
.ev{display:flex;gap:10px;padding:9px 10px;border-radius:10px;background:var(--card2);border:1px solid var(--line2);margin-bottom:6px;cursor:pointer;align-items:flex-start}
.ev:hover{border-color:var(--line)}
.ev .bar{width:4px;align-self:stretch;border-radius:4px;flex:none}
.ev .tm{font-size:13px;font-weight:600;width:88px;flex:none;color:var(--muted)}
.ev .bd{flex:1;min-width:0}
.ev .bd .tt{font-weight:500}
.ev .bd .mm{font-size:12.5px;color:var(--muted);white-space:pre-wrap}

/* mood */
.mood{display:flex;gap:6px;flex-wrap:wrap}
.mood button{border:1px solid var(--line);background:var(--card2);border-radius:20px;padding:5px 11px;font-size:13px}
.mood button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.stat{box-shadow:var(--shadow);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--muted);font-weight:500}
.stat .v{font-size:22px;font-weight:600;letter-spacing:-.4px;margin-top:2px}
.stat .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}

/* calendar */
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.cal .dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--card2);border-bottom:1px solid var(--line)}
.cal .dow div{padding:8px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.cal .dow div:first-child{color:var(--red)} .cal .dow div:last-child{color:var(--blue)}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cell{min-height:112px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:6px 6px 8px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--card)}
.cell:nth-child(7n){border-right:0}
.cell:hover{background:var(--hover-cell)}
.cell.other{background:var(--sunk)}
.cell.other .dn{color:var(--other-dn)}
.cell .top{display:flex;align-items:center;justify-content:space-between;gap:4px}
.cell .dn{font-size:13px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cell.sun .dn{color:var(--red)} .cell.sat .dn{color:var(--blue)}
.cell.today .dn{background:var(--accent);color:var(--on-accent)}
.cell .marks{display:flex;gap:3px;align-items:center}
.cell .marks i{width:6px;height:6px;border-radius:50%;display:block}
.echip{font-size:11.5px;line-height:1.35;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;--c:#00CCAA;background:color-mix(in srgb,var(--c) 22%,transparent);color:color-mix(in srgb,var(--c) 60%,var(--mixto));border-left:3px solid var(--c)}
.echip.g{--c:var(--blue)}
.gbadge{font-size:10px;font-weight:700;color:var(--g-ink);background:rgba(111,168,255,.16);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
.gbadge.fail{color:var(--red);background:var(--red-soft)}
.ev.g{background:rgba(111,168,255,.06);border-color:rgba(111,168,255,.18)}
.gline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:-6px 0 14px}
.gline .dot{width:7px;height:7px;border-radius:50%;background:var(--blue);display:inline-block}
.gline.err .dot{background:var(--red)}
.toggle{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px;cursor:pointer}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.tchip{font-size:11px;color:var(--muted);padding-left:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* tables */
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line)}
table.t td{padding:5px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr.we td{background:var(--sunk);color:var(--faint)}
table.t tr.td td{background:var(--accent-soft)}
table.t input,table.t select{padding:5px 7px;font-size:13px;background:transparent;border-color:transparent}
table.t input:hover,table.t select:hover{border-color:var(--line)}
.tablewrap{overflow-x:auto}

/* growth */
.hbar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.hbar .lb{width:110px;flex:none;color:var(--muted)}
.hbar .tr{flex:1;height:10px;background:var(--line2);border-radius:6px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:6px}
.hbar .vl{width:70px;text-align:right;flex:none;font-weight:600}
.glog{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line2)}
.glog:last-child{border-bottom:0}
.glog .dt{font-size:12px;color:var(--muted);width:62px;flex:none;padding-top:2px}
.glog .bd{flex:1;min-width:0}

/* reviews */
.rlist .r{padding:12px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.rlist .r:hover .ln{color:var(--accent)}
.rlist .r:last-child{border-bottom:0}
.rlist .ln{font-weight:500}
.rlist .kpt{font-size:13px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wkdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.wkd{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:8px;min-height:84px;font-size:12px;cursor:pointer}
.wkd:hover{border-color:var(--line)}
.wkd .d{font-weight:600;color:var(--muted);margin-bottom:4px}
.wkd .l{color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* settings list */
.elist .e{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.elist .e input{flex:1}

/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal{background:var(--modal);border:1px solid var(--line);border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow:auto;padding:20px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h3{margin:0 0 12px;font-size:17px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;align-items:center}
.modal .actions .grow{flex:1}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--toast);border:1px solid var(--line-strong);color:var(--ink);padding:10px 14px;border-radius:12px;font-size:14px;display:flex;gap:12px;align-items:center;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast button{background:transparent;border:0;color:var(--accent);font-weight:600;padding:0}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}

/* priority S/A/B/C · status */
select.psel,select.ssel{appearance:none;-webkit-appearance:none;width:auto;flex:none;border:1px solid transparent;border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:700;line-height:1.4;cursor:pointer;text-align:center}
select.psel:focus,select.ssel:focus{box-shadow:0 0 0 3px rgba(0,204,170,.18)}
select.psel.p-S{background:var(--red-soft);color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
select.psel.p-A{background:var(--amber-soft);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
select.psel.p-B{background:var(--blue-soft);color:var(--blue);border-color:color-mix(in srgb,var(--blue) 45%,transparent)}
select.psel.p-C{background:var(--chipbg);color:var(--muted);border-color:var(--line)}
select.ssel{background:var(--card2);color:var(--muted);border-color:var(--line);font-weight:600}
select.ssel.s-doing{background:var(--accent-soft);color:var(--accent);border-color:rgba(0,204,170,.4)}
select.ssel.s-done{color:var(--faint)}
.items li.todo .psel{align-self:center}

/* today layout · 기록 접기 */
.grid2.today2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.recs{margin-top:24px;border-top:1px solid var(--line)}
.recs > summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:14px 2px;font-weight:600;font-size:15px;color:var(--muted)}
.recs > summary::-webkit-details-marker{display:none}
.recs > summary::before{content:"▸";color:var(--faint);width:12px}
.recs[open] > summary::before{content:"▾"}
.recs > summary:hover{color:var(--ink)}

/* weekly schedule */
.wkhint{color:var(--muted);font-size:14px;margin-top:4px}
.wknav{display:flex;align-items:center;gap:8px}
.wknav b{font-size:15px;font-weight:700;padding:0 6px;white-space:nowrap}
.wk7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:18px}
.wday{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;min-height:156px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;box-shadow:var(--shadow);transition:border-color .12s,background .12s}
.wday:hover{border-color:var(--line-strong)}
.wday.sel{border:2px solid var(--accent);background:var(--accent-soft);padding:11px 11px 9px}
.wday.drop{border:2px dashed var(--accent);background:var(--accent-soft);padding:11px 11px 9px}
.wd-d{font-size:13px;font-weight:600;color:var(--muted)}
.wday.sun .wd-d{color:var(--red)} .wday.sat .wd-d{color:var(--blue)}
.wd-n{font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:-.4px}
.wday.today .wd-n{color:var(--accent)}
.wd-i{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;min-width:0;padding:2px 3px;border-radius:5px;cursor:grab}
.wd-i span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wd-i:hover{background:var(--ghost-h)}
.wd-i .pd{width:7px;height:7px;border-radius:50%;flex:none}
.wd-i.done span{color:var(--faint);text-decoration:line-through}
.wd-i.doing span::before{content:"▶ ";color:var(--accent);font-size:10px}
.wd-e{font-size:13px;color:var(--faint)}
.wgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.witems{list-style:none;margin:0;padding:0}
.wit{display:flex;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid var(--line2);background:var(--card)}
.wit:last-child{border-bottom:0}
.wit.dragging,.wd-i.dragging,.nodue .wd-i.dragging{opacity:.4}
.wit .grip{cursor:grab;color:var(--faint);font-size:16px;user-select:none;padding:0 2px;line-height:1}
.wit .tx{flex:1;min-width:0;font-weight:500;font-size:15px;word-break:break-word;cursor:pointer}
.wit .tx .tag{margin-left:6px;vertical-align:1px}
.wit.done .tx{color:var(--faint);text-decoration:line-through}
.wit .icon-btn{width:30px;height:30px;font-size:14px}
.datebtn{position:relative;overflow:hidden;cursor:pointer}
.datebtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.datebtn input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
.wkdrag{font-size:12.5px;color:var(--faint);margin:10px 2px 0}
.nodue{border:1px dashed var(--line);border-radius:10px;padding:8px;min-height:60px;display:flex;flex-direction:column;gap:2px}
.nodue.drop{border-color:var(--accent);background:var(--accent-soft)}
.wkstat .big{font-size:26px;font-weight:700;letter-spacing:-.5px}
.wkstat .big small{font-size:14px;color:var(--muted);font-weight:500}
.pcount{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pcount span{font-size:12px;font-weight:700;padding:2px 9px;border-radius:7px}

/* memo */
.memoin textarea{min-height:96px;font-size:15.5px}
.memogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.memo{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:140px;box-shadow:var(--shadow);min-width:0;text-align:left;width:100%}
.memo:hover{border-color:var(--line-strong)}
.memo .mh{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.memo .mb{flex:1;font-size:13.5px;color:var(--muted);white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.memo .md{font-size:12px;color:var(--faint)}

/* AI lab */
.labgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.labc{position:relative;min-width:0}
.lab{display:flex;flex-direction:column;height:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:border-color .15s}
a.lab:hover{border-color:var(--accent)}
.lab .thumb{position:relative;aspect-ratio:16/9;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,var(--card));color:var(--c);font-size:40px;font-weight:700;white-space:nowrap;border-bottom:1px solid var(--line2);overflow:hidden}
.lab .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lab .lb{padding:12px 14px 14px;min-width:0}
.lab .lt{font-weight:600;font-size:15.5px;word-break:break-word}
.lab .ld{font-size:13px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lab .lu{font-size:12px;color:var(--faint);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ledit{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--modal);color:var(--ink);display:grid;place-items:center;opacity:0;transition:opacity .15s}
.labc:hover .ledit,.ledit:focus{opacity:1}
@media (hover:none){.ledit{opacity:1}}
button.labadd{border:1.5px dashed var(--line-strong);background:transparent;box-shadow:none;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:14px;font-weight:600;width:100%}
button.labadd b{font-size:30px;font-weight:400;color:var(--accent)}
button.labadd:hover{border-color:var(--accent);color:var(--ink)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{cursor:pointer}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches i{display:block;width:28px;height:28px;border-radius:8px;border:2px solid transparent}
.swatches input:checked + i{border-color:var(--ink)}
.swatches input:focus-visible + i{box-shadow:0 0 0 3px rgba(0,204,170,.3)}

/* mobile */
@media (max-width:900px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .mgrid{grid-template-columns:minmax(0,1fr)}
  .mgrid.has-sel .mlist{display:none}
  .mgrid:not(.has-sel) .meditor{display:none}
  .mlist{position:static;max-height:none}
  .mback{display:inline-flex}
  .mrow{flex-wrap:wrap}
  .mrow > div{flex:1 1 40%}
  .actadd input[name=t]{flex:1 1 100%}
  .grid2.today2{grid-template-columns:minmax(0,1fr)}
  .today2 .att-col{order:-1}
  .wgrid{grid-template-columns:minmax(0,1fr)}
  .wk7{grid-template-columns:repeat(7,minmax(108px,1fr));overflow-x:auto;padding-bottom:4px}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));flex-direction:row;border-right:0;border-top:1px solid var(--line);z-index:40;background:var(--nav-m);backdrop-filter:blur(10px)}
  .brand,.side .foot{display:none}
  .msync{display:inline-flex;order:3;width:100%}
  .mlogo{display:block;order:-1;width:100%;max-width:96px;height:auto;margin-bottom:2px}
  .main{position:relative}
  .topbar .themebtn{position:absolute;top:14px;right:14px}
  .topbar{padding-right:42px}
  .topright{gap:0}
  .nav{flex-direction:row;justify-content:space-around;width:100%;gap:0}
  .nav a{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 4px;flex:1;text-align:center}
  .nav a svg{width:21px;height:21px}
  .main{padding:18px 14px 96px}
  .studypane{grid-column:1;height:calc(100vh - 66px - env(safe-area-inset-bottom));height:calc(100dvh - 66px - env(safe-area-inset-bottom))}
  .studybar{padding:10px 12px}
  h1.page{font-size:23px}
  .cell{min-height:72px;padding:4px 3px}
  .echip{font-size:10px;padding:1px 4px}
  .ev .tm{width:70px}
  .wkdays{grid-template-columns:repeat(7,minmax(70px,1fr));overflow-x:auto}
  .prob .bar{width:80px}
  .onething{flex-direction:column;align-items:stretch;gap:6px}
  .top3{grid-template-columns:minmax(0,1fr);gap:8px}
  .subs{margin-left:30px}
  .wheel-bg{align-items:flex-end;padding:0}
  .wheel{width:100%;border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom))}
  .nav a{font-size:10px;padding:6px 1px}
  .nav a svg{width:20px;height:20px}
  form[data-form=todo-quick] input[type=text]{flex:1 1 100%}
  form[data-form=todo-quick] select{flex:1}
  .cb.sm{width:20px;height:20px}
  .sub{padding:7px 0}
  .subtoggle{padding:4px 9px;font-size:12px}
  .top3head .btn{margin-left:0}
  .app{grid-template-columns:minmax(0,1fr)}
  .card{padding:16px 14px 14px}
  .grid2,.col{gap:14px}
  .cb{width:23px;height:23px}
  .items li{padding:10px 2px}
  .x{padding:8px 9px;font-size:16px}
  .icon-btn{width:38px;height:38px}
  .btn{min-height:38px;padding:8px 13px}
  .btn.sm{min-height:32px}
  input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{font-size:15px;padding:10px 11px}
  .att .slot{padding:10px}
  .att .slot .v,.att input[type=time]{font-size:18px}
  .att .big{padding:13px 8px}
  .dayhead{gap:8px}
  .dayhead input[type=date]{width:100% !important}
  .pagehead{gap:8px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
  .stat{padding:10px 12px}
  .stat .v{font-size:19px}
  .echip .et{display:none}
  .cell .marks{display:none}
  .cell .dn{width:22px;height:22px;font-size:12px}
  .tchip{font-size:10px}
  .legend{gap:10px;font-size:11.5px}
  .legend span[style*="margin-left:auto"]{margin-left:0 !important}
  .wkdays{display:grid;grid-template-columns:repeat(7,84px);overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .att-t th:nth-child(2),.att-t td:nth-child(2),.att-t th:nth-child(7),.att-t td:nth-child(7){display:none}
  .att-t th:first-child,.att-t td:first-child{position:sticky;left:0;background:var(--card);z-index:1}
  .att-t tr.td td:first-child{background:var(--accent-soft)}
  .att-t tr.we td:first-child{background:var(--sunk)}
  table.t td{padding:4px 5px}
  table.t input[type=time]{min-width:0;width:100%;max-width:104px;font-size:13.5px;padding:5px 3px}
  .hbar .lb{width:84px}
  .modal-bg{align-items:flex-end;padding:0}
  .modal{max-width:none;border-radius:18px 18px 0 0;max-height:88vh;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .modal .row{flex-wrap:wrap}
  .modal .row > .full-m{flex:1 1 100% !important}
  .modal .actions .btn{min-height:42px;padding:9px 16px}
  .ev .tm{width:64px;font-size:12px}
  .glog .dt{width:52px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom));max-width:92vw}
  .nav{justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{flex:0 0 62px}
  .wit{flex-wrap:wrap}
  .wit .tx{flex:1 1 calc(100% - 70px)}
  .wday{min-height:132px}
  .wknav{width:100%}
  .wknav b{flex:1;text-align:center;font-size:14px;white-space:normal}
  .wgrid .cardhead{flex-wrap:wrap}
}
</style>

const LS_KEY = 'iljalleo-notes-v1';

      const timer = setTimeout(() => { state.banner = '저장소 응답이 늦어요. 작성한 내용은 이 기기에 먼저 보관하고, 연결되면 자동으로 올려요.'; render(); }, 10000);

/* ---------- getters ---------- */
const settings = () => Object.assign(defaultSettings(), Store.get('settings') || {});

const hasRetro = d => { const r = d.retro || {}; return !!(r.line || r.good || r.bad || r.try); };

/* 우선순위 S·A·B·C (예전 기록의 높음/보통/낮음은 A/B/C로 읽어요) */
const PRI = [['S','최우선'],['A','높음'],['B','보통'],['C','낮음']];
const PRI_OLD = { high:'A', mid:'B', low:'C' };

const ST = [['todo','To do'],['doing','진행 중'],['done','완료']];

const statusSelect = t => { const s = statusOf(t); return `<select class="ssel s-${s}" data-act-change="todo-status" data-id="${esc(t.id)}" aria-label="진행 상태">${ST.map(([k,l]) => `<option value="${k}" ${k === s ? 'selected' : ''}>${l}</option>`).join('')}</select>`; };
function sortTodos(list){
  const rk = t => 'SABC'.indexOf(prioOf(t));
  return list.slice().sort((a,b) => (a.done - b.done) || (rk(a) - rk(b)) || ((a.due||'9999') < (b.due||'9999') ? -1 : (a.due||'9999') > (b.due||'9999') ? 1 : 0) || ((a.createdAt||'') < (b.createdAt||'') ? -1 : 1));
}
function dueLabel(due, ref){
  if(!due) return ''; const n = diffDays(ref || today(), due);
  if(n < 0) return `<span class="overdue">${-n}일 지남</span>`;
  if(n === 0) return '<span class="chip amber" style="padding:1px 7px">오늘</span>';
  if(n === 1) return '내일';

function rangeStats(start, end){
  let full=0, over=0, days=0, mins=0, growth=0, retro=0, moodSum=0, moodN=0, ins=[], outs=[], ckDone=0, ckTotal=0;
  const S = settings(); const t = today();
  for(let s = start; s <= end; s = addDays(s,1)){
    const d = dayDoc(s);
    if(d.inAt){ days++; ins.push(toMin(d.inAt)); }
    if(d.outAt) outs.push(toMin(d.outAt));
    mins += workMin(d);
    if(workMin(d)){ full++; over += workMin(d) - stdMin(); }
    (d.growth||[]).forEach(g => growth += Number(g.min)||0);
    if(hasRetro(d)) retro++;
    if(d.retro && d.retro.mood){ moodSum += d.retro.mood; moodN++; }
    if(s <= t && (d.inAt || Object.keys(d.checks||{}).length)){ ckTotal += S.checklist.length; ckDone += S.checklist.filter(c => (d.checks||{})[c.id]).length; }
  }
  const done = todos().filter(x => x.done && x.doneAt && x.doneAt >= start && x.doneAt <= end).length;
  const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  return { full, over, days, mins, growth, retro, mood: moodN ? (moodSum/moodN) : null, avgIn: avg(ins), avgOut: avg(outs), done, ck: ckTotal ? Math.round(ckDone/ckTotal*100) : null };
}

function currentRoute(){ const h = (location.hash || '').slice(1); return ROUTES.some(r => r[0] === h) ? h : 'today'; }

/* ---------- render ---------- */
function renderNav(){
  document.getElementById('nav').innerHTML = ROUTES.map(([k,l,ic]) => `<a href="#${k}" class="${state.route===k?'on':''}"><svg viewBox="0 0 24 24">${ic}</svg><span>${l}</span></a>`).join('');
  document.getElementById('brandT').textContent = `${settings().name || ''}의 일잘러 노트`.replace(/^의 /,'');
}
let lastRoute = null;
function render(){
  if(Store.mode === 'loading') return;
  if(Store.mode === 'login'){ renderLogin(); return; }
  document.body.classList.remove('login');
  state.route = currentRoute();
  { const t = curTheme(); if((document.documentElement.dataset.theme === 'light') !== (t === 'light')) applyTheme(t); }
  renderNav();
  if(showStudy(state.route === 'study')){ lastRoute = state.route; state.pendingRender = false; return; }
  const y = window.scrollY, same = lastRoute === state.route;
  const views = { today:viewToday, week:viewWeek, calendar:viewCalendar, todos:viewTodos, memo:viewMemos, lab:viewLab, meetings:viewMeetings, review:viewReview, attendance:viewAttendance, prefs:viewPrefs };
  document.getElementById('main').innerHTML = topbar() + (state.banner ? `<div class="banner">${esc(state.banner)}</div>` : '') + views[state.route]();
  document.querySelectorAll('#main textarea').forEach(autosize);
  if(same) window.scrollTo(0, y); else window.scrollTo(0, 0);
  if(!same && state.route === 'memo' && window.innerWidth > 760){ const m = document.querySelector('[data-memo-in]'); if(m) m.focus(); }
  lastRoute = state.route;
  state.pendingRender = false;
  const sy = document.getElementById('sync'), m = document.getElementById('msync'); if(sy && m){ m.className = sy.className + ' msync'; m.lastElementChild.textContent = sy.lastElementChild.textContent; }
}

const STUDY_URL = 'https://realworker-study.vercel.app/';
function showStudy(on){
  const pane = document.getElementById('studyPane'), main = document.getElementById('main');
  pane.hidden = !on; main.hidden = on;
  if(on && !pane.firstChild){
    pane.innerHTML = `<div class="studybar"><b>리얼워커 학습노트</b><button class="btn sm" data-act="study-reload">새로고침</button><a class="btn sm" href="${STUDY_URL}" target="_blank" rel="noopener">새 탭에서 열기 ↗</a></div><iframe src="${STUDY_URL}" title="리얼워커 학습노트" allow="clipboard-write"></iframe>`;
  }

}
function isEditing(){ const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && (a.closest('#main') || a.closest('#modalRoot')); }

document.addEventListener('focusout', () => setTimeout(() => { if(state.pendingRender && !isEditing() && !document.querySelector('.modal-bg') && !document.querySelector('.wheel-bg')) render(); }, 60));

async function sendLoginLink(){
  const L = loginState; L.busy = true; L.msg = ''; renderLogin();
  try{ const sb = await getSupabase(); const { error } = await sb.auth.signInWithOtp({ email:L.email, options:{ emailRedirectTo: location.origin + location.pathname, shouldCreateUser:false } });
    if(error) throw error; L.sent = true; }
  catch(e){ const m = (e && e.message) || '';
    L.msg = /rate|seconds|limit/i.test(m) ? '메일 한도(1시간에 2통)에 걸렸어요. 비밀번호가 있다면 비밀번호로 로그인하고, 없다면 1시간 뒤에 다시 시도해 주세요. 앞서 받은 메일이 있다면 그 링크를 눌러도 돼요.'
      : /not found|signups not allowed|not allowed/i.test(m) ? '등록되지 않은 이메일이에요. 처음 로그인한 이메일을 넣어 주세요.'
      : '로그인 링크를 보내지 못했어요: ' + m; }
  L.busy = false; renderLogin();
}

  { const w = weekInfo(date); GCal.ensure(w.start, w.end); }
  const chips = [];

/* 필수 기록 · 하루 회고: 메인 아래에 접어 두고, 펼친 상태는 기억해요 */
function recordsBlock(id, d, S){
  const ess = d.essentials || {}, filled = S.essentials.filter(f => (ess[f.id]||'').trim()).length;
  return `<details class="recs" ${state.recOpen ? 'open' : ''}>
    <summary>필수 기록 · 하루 회고 <span class="hint num" style="font-weight:500">기록 ${filled}/${S.essentials.length} · 회고 ${hasRetro(d) ? '작성함' : '작성 전'}</span></summary>
    <div class="grid2">${essentialsCard(id, d, S)}${retroCard(id, d)}</div>
  </details>`;
}
function top3Of(d){ const t = d.top3 || {}; return [0,1,2].map(i => t[i] || t[String(i)] || { text:'', done:false }); }
function top3Block(date, id, d){
  const items = top3Of(d), filled = items.filter(x => (x.text||'').trim()).length, done = items.filter(x => x.done && (x.text||'').trim()).length;
  const have = new Set(items.map(x => (x.text||'').trim()));
  const prev = top3Of(dayDoc(addDays(date,-1))).filter(x => (x.text||'').trim() && !x.done && !have.has(x.text.trim()));
  const canCarry = prev.length && items.some(x => !(x.text||'').trim());
  return `<section class="top3wrap">
    <div class="top3head"><b>오늘의 우선순위</b><span class="hint num">${filled ? `${done}/${filled} 완료` : '중요한 순서대로 3가지'}</span>
      ${canCarry ? `<button class="btn sm ghost" data-act="top3-carry" data-date="${date}">↩ 어제 못 끝낸 ${prev.length}개 가져오기</button>` : ''}</div>
    <div class="top3">${items.map((x,i) => `<div class="tp ${x.done && (x.text||'').trim() ? 'done' : ''}">
      <span class="no num">${i+1}</span>
      <input type="text" ${bind(id,'top3.'+i+'.text')} data-rerender="1" value="${esc(x.text||'')}" placeholder="${['가장 중요한 일','두 번째로 중요한 일','세 번째로 중요한 일'][i]}" autocomplete="off">
      <input type="checkbox" class="cb" data-act="top3-done" data-date="${date}" data-i="${i}" ${x.done ? 'checked' : ''} ${(x.text||'').trim() ? '' : 'disabled'} aria-label="${i+1}번 완료">
    </div>`).join('')}</div></section>`;
}
function attendanceCard(date, d, isToday){
  const id = 'day-' + date;
  const slot = (k, key, label, cls) => {
    if(d[key]) return `<div class="slot"><div class="k">${label}</div><input type="time" class="num" ${bind(id,key)} value="${esc(d[key])}" data-rerender="1"></div>`;
    if(isToday) return `<div class="slot"><div class="k">${label}${key==='outAt' && d.inAt ? `<span style="font-weight:500;float:right">예상</span>` : ''}</div><button class="big ${cls}" data-act="${k}" ${key==='outAt' && !d.inAt ? 'disabled' : ''}>${label}하기</button>${key==='outAt' && d.inAt ? `<div class="eta" id="eta">${etaText(d.inAt)}</div>` : ''}</div>`;
    return `<div class="slot"><div class="k">${label}</div><input type="time" class="num" ${bind(id,key)} value="" data-rerender="1"></div>`;
  };
  let status = '';
  if(d.inAt && d.outAt){ const w = workMin(d); status = `근무 <b class="num" style="color:var(--ink)">${fmtMin(w)}</b> <span class="num" style="color:${w >= stdMin() ? 'var(--accent)' : 'var(--amber)'}">(${diffLabel(w - stdMin())})</span>`; }
  else if(d.inAt && isToday) status = `근무 중 <b class="num" id="elapsed" style="color:var(--ink)">${fmtMin(Math.max(0, toMin(nowHM()) - toMin(d.inAt)))}</b>`;
  else if(d.inAt) status = `예상 퇴근 <b class="num" style="color:var(--ink)">${clockHM(etaMin(d.inAt))}</b>`;
  else status = '<span class="hint">출근 기록이 없어요</span>';
  return card('출퇴근', `<div class="att">${slot('clock-in','inAt','출근','')}${slot('clock-out','outAt','퇴근','out')}</div>
    <div class="attfoot"><span>${status}</span><select ${bind(id,'workType')}>${WORKTYPES.map(w => `<option ${ (d.workType||'사무실')===w ? 'selected':''}>${w}</option>`).join('')}</select></div>`);
}
function todoRow(t, ref){
  const subs = t.subs || [], sd = subs.filter(x => x.done).length, open = state.openTodos.has(t.id);
  const subBtn = `<button class="subtoggle ${open ? 'on' : ''} ${subs.length && sd === subs.length ? 'all' : ''}" data-act="sub-open" data-id="${esc(t.id)}" aria-expanded="${open}">${open ? '▾' : '▸'} ${subs.length ? `세부 <b class="num">${sd}/${subs.length}</b>` : '세부 추가'}</button>`;
  return `<li class="todo ${t.done?'done':''}"><input type="checkbox" class="cb" data-act="todo-toggle" data-id="${esc(t.id)}" ${t.done?'checked':''}>
    ${prioSelect(t)}
    <span class="tx"><span data-act="todo-edit" data-id="${esc(t.id)}" style="cursor:pointer">${esc(t.title)}</span>
      <span class="meta">${statusOf(t) === 'doing' ? '<span class="chip" style="padding:0 7px">▶ 진행 중</span>' : ''}${t.done ? '' : dueLabel(t.due, ref)}${t.tag ? `<span class="tag">${esc(t.tag)}</span>` : ''}${t.memo ? '<span>· 메모</span>' : ''}${subBtn}</span>
      ${subs.length && !open ? `<span class="subbar"><i style="width:${sd/subs.length*100}%"></i></span>` : ''}</span>
    <button class="x" data-act="todo-del" data-id="${esc(t.id)}" aria-label="삭제">✕</button>
    ${open ? `<div class="subs">
      ${subs.map(x => `<div class="sub ${x.done ? 'done' : ''}"><input type="checkbox" class="cb sm" data-act="sub-toggle" data-id="${esc(t.id)}" data-sid="${esc(x.id)}" ${x.done ? 'checked' : ''}>
        <span class="stx">${esc(x.title)}</span><button class="x" data-act="sub-del" data-id="${esc(t.id)}" data-sid="${esc(x.id)}" aria-label="세부 항목 삭제">✕</button></div>`).join('')}
      <form class="subadd" data-form="sub-add" data-id="${esc(t.id)}"><span class="plus">+</span><input type="text" name="t" placeholder="세부 항목 추가 후 Enter" autocomplete="off"></form>
    </div>` : ''}</li>`;
}
function weekDue(date){ const w = weekInfo(date), fri = addDays(w.start, 4); return date <= fri ? fri : w.end; }
function dueFor(kind, date){ return kind === 'today' ? date : kind === 'tomorrow' ? addDays(date,1) : kind === 'week' ? weekDue(date) : null; }
function todayTodosCard(date){
  const all = todos(), tm = addDays(date,1), wk = weekInfo(date).end, isT = date === today();
  const open = all.filter(t => !t.done);

/* ----- CALENDAR ----- */
function viewCalendar(){
  const k = state.calMonth, first = parse(k + '-01'), t = today();
  const start = addDays(k + '-01', -first.getDay());
  const lastDay = k + '-' + pad(daysInMonth(k));
  const endS = addDays(lastDay, 6 - parse(lastDay).getDay());
  const T = todos();
  GCal.ensure(start, endS);
  const gids = GCal.localGids(), gOn = GCal.enabled();
  let cells = '';
  for(let s = start; s <= endS; s = addDays(s,1)){
    const d = dayDoc(s), dow = parse(s).getDay();
    const evs = (d.events||[]).map(e => Object.assign({ _local:true }, e)).concat(gOn ? GCal.eventsOn(s, gids) : []).sort((a,b) => (a.time||'') < (b.time||'') ? -1 : (a.time||'') > (b.time||'') ? 1 : 0);
    const due = T.filter(x => !x.done && x.due === s).length;
    const cls = ['cell', monthKey(s) !== k ? 'other' : '', s === t ? 'today' : '', dow===0 ? 'sun' : '', dow===6 ? 'sat' : ''].join(' ');
    const marks = (d.inAt ? '<i style="background:#00CCAA" title="출근 기록"></i>' : '') + (hasRetro(d) ? '<i style="background:#F0B45A" title="회고"></i>' : '');
    cells += `<div class="${cls}" data-act="cal-day" data-date="${s}"><div class="top"><span class="dn num">${parse(s).getDate()}</span><span class="marks">${marks}</span></div>
      ${evs.slice(0,3).map(e => e._local ? `<div class="echip" style="--c:${EV_CATS[e.cat]||'#8C9794'}">${e.time ? `<span class="et">${esc(e.time)} </span>` : ''}${esc(e.title)}</div>` : `<div class="echip g">${e.time ? `<span class="et">${esc(e.time)} </span>` : ''}${esc(e.title)}</div>`).join('')}
      ${evs.length > 3 ? `<div class="more">+${evs.length-3}개</div>` : ''}
      ${due ? `<div class="tchip">할 일 ${due}</div>` : ''}</div>`;
  }
  const ms = rangeStats(k + '-01', lastDay);
  const evCount = Array.from({length: daysInMonth(k)}, (_,i) => (dayDoc(k + '-' + pad(i+1)).events||[]).length).reduce((a,b)=>a+b,0);
  return `<div class="pagehead"><button class="icon-btn" data-act="cal-prev">‹</button><h1 class="page">${monthLabel(k)}</h1><button class="icon-btn" data-act="cal-next">›</button>
    <span class="grow"></span>${k !== monthKey(t) ? '<button class="btn" data-act="cal-today">이번 달</button>' : ''}<button class="btn pri" data-act="event-new" data-date="${monthKey(t)===k ? t : k+'-01'}">+ 일정 추가</button></div>
  ${gcalLine()}
  <div class="stats">
    <div class="stat"><div class="k">일정</div><div class="v num">${evCount}<small>개</small></div></div>
    <div class="stat"><div class="k">출근일</div><div class="v num">${ms.days}<small>일</small></div></div>
    <div class="stat"><div class="k">완료한 할 일</div><div class="v num">${ms.done}<small>개</small></div></div>
    <div class="stat"><div class="k">회고 작성</div><div class="v num">${ms.retro}<small>일</small></div></div>
  </div>
  <div class="cal"><div class="dow">${DOW.map(x => `<div>${x}</div>`).join('')}</div><div class="grid">${cells}</div></div>
  <div class="legend">${Object.entries(EV_CATS).map(([n,c]) => `<span><i style="background:${c}"></i>${n}</span>`).join('')}
    ${gOn ? '<span><i style="background:#6FA8FF"></i>구글 캘린더</span>' : ''}<span style="margin-left:auto"><i style="background:#00CCAA"></i>출근</span><span><i style="background:#F0B45A"></i>회고</span></div>`;
}

/* ----- TODOS ----- */
function viewTodos(){
  const t = today(), wk = weekInfo(t), all = todos();
  const filters = [['open','진행 중'],['today','오늘까지'],['tomorrow','내일'],['week','이번 주'],['nodue','마감 없음'],['done','완료'],['all','전체']];
  const f = state.todoFilter;
  let list = all.filter(x => f === 'open' ? !x.done : f === 'today' ? (!x.done && x.due && x.due <= t) : f === 'tomorrow' ? (!x.done && x.due === addDays(t,1)) : f === 'week' ? (!x.done && x.due && x.due <= wk.end) : f === 'nodue' ? (!x.done && !x.due) : f === 'done' ? x.done : true);
  list = sortTodos(list);
  if(f === 'done') list.sort((a,b) => (b.doneAt||'') < (a.doneAt||'') ? -1 : 1);
  const tags = [...new Set(all.map(x => x.tag).filter(Boolean))];
  const counts = { open: all.filter(x => !x.done).length, overdue: all.filter(x => !x.done && x.due && x.due < t).length, doneWeek: all.filter(x => x.done && x.doneAt >= wk.start && x.doneAt <= wk.end).length };
  return `<div class="pagehead"><h1 class="page">할 일</h1></div>
  <div class="stats">
    <div class="stat"><div class="k">진행 중</div><div class="v num">${counts.open}<small>개</small></div></div>
    <div class="stat"><div class="k">마감 지남</div><div class="v num" style="${counts.overdue?'color:var(--red)':''}">${counts.overdue}<small>개</small></div></div>

      <input type="date" name="d" style="width:auto" title="마감일">

  </section>
  <div style="margin-bottom:12px"><div class="seg">${filters.map(([k,l]) => `<button data-act="todo-filter" data-f="${k}" class="${f===k?'on':''}">${l}</button>`).join('')}</div></div>
  <section class="card">${list.length ? `<ul class="items">${list.map(x => todoRow(x, t)).join('')}</ul>` : '<div class="empty">해당하는 할 일이 없어요.</div>'}</section>`;

const meetings = () => Object.keys(Store.docs).filter(k => k.startsWith('mtg-') && Store.docs[k]).map(k => Object.assign({ _key:k }, Store.docs[k]))
  .sort((a,b) => ((b.date||'') + (b.time||'')) < ((a.date||'') + (a.time||'')) ? -1 : ((b.date||'') + (b.time||'')) > ((a.date||'') + (a.time||'')) ? 1 : ((b.createdAt||'') < (a.createdAt||'') ? -1 : 1));
function actionState(m){ const T = todos(); return (m.actions||[]).map(a => { const t = a.todoId ? T.find(x => x.id === a.todoId) : null; return Object.assign({}, a, { done: t ? !!t.done : !!a.done, linked: !!t }); }); }

  'todo-add': f => { const t = f.t.value.trim(); if(!t) return; mutTodos(items => items.push({ id:uid(), title:t, due:f.d.value || null, priority:f.p.value, tag:f.g.value.trim(), done:false, doneAt:null, createdAt:new Date().toISOString() })); render(); focusForm('todo-add'); },
  'wk-add': f => { const t = f.t.value.trim(), date = f.dataset.date; if(!t) return; const p = f.p.value;
    mutTodos(items => items.push({ id:uid(), title:t, due:date, priority:p, status:'todo', tag:'', done:false, doneAt:null, createdAt:new Date().toISOString() }));
    render(); const sel = document.querySelector('form[data-form="wk-add"] select[name=p]'); if(sel){ sel.value = p; sel.className = 'psel p-' + p; } focusForm('wk-add'); },
  'memo-add': f => { const t = f.t.value.replace(/\s+$/, ''); if(!t.trim()) return; const now = new Date().toISOString();
    Store.mutate('memos', d => { d.items = d.items || []; d.items.push({ id:uid(), text:t, createdAt:now, updatedAt:now }); }); render(); toast('메모를 저장했어요');
    const m = document.querySelector('[data-memo-in]'); if(m) m.focus(); },
  'memo-save': f => { const id = f.dataset.id, t = f.t.value.replace(/\s+$/, '');
    Store.mutate('memos', d => { const m = (d.items || []).find(x => x.id === id); if(m && m.text !== t){ m.text = t; m.updatedAt = new Date().toISOString(); } }); closeModal(); render(); },
  'lab-save': f => { const url = safeUrl(f.url.value); if(!url){ toast('링크 주소를 확인해 주세요 (https://로 시작)'); f.url.focus(); return; }
    const img = f.img.value.trim() ? safeUrl(f.img.value) : '';
    const v = { title:f.title.value.trim(), url, desc:f.desc.value.trim(), mark:f.mark.value.trim(), img, color:(f.querySelector('input[name=color]:checked') || {}).value || '' };
    if(!v.title) return;
    const id = f.dataset.id;
    Store.mutate('lab', d => { d.items = d.items || []; const x = id && d.items.find(y => y.id === id); if(x) Object.assign(x, v); else d.items.push(Object.assign({ id:uid(), createdAt:new Date().toISOString() }, v)); });
    closeModal(); render(); toast(id ? 'AI 툴을 수정했어요' : 'AI 툴을 추가했어요'); },
  'todo-save': f => { const id = f.dataset.id; mutTodos(items => { const x = items.find(t => t.id === id); if(x){ x.title = f.t.value.trim() || x.title; x.due = f.d.value || null; x.priority = f.p.value; x.tag = f.g.value.trim(); x.memo = f.m.value; } }); closeModal(); render(); },
  'event-save': async f => {
    const orig = f.dataset.orig, id = f.dataset.id || uid(), date = f.date.value || orig;
    const prev = f.dataset.id ? (dayDoc(orig).events || []).find(e => e.id === id) : null;
    const ev = { id, title:f.title.value.trim(), time:f.time.value, end:f.end.value, cat:f.cat.value, memo:f.memo.value, gid:(prev && prev.gid) || null, gsync:(prev && prev.gsync) || null };
    if(!ev.title) return;
    const push = !!(f.push && f.push.checked);
    const save = (dt, patch) => mutDay(dt, d => { d.events = d.events || []; const i = d.events.findIndex(e => e.id === id); const cur = Object.assign({}, i > -1 ? d.events[i] : ev, patch || {}); if(i > -1) d.events[i] = cur; else d.events.push(cur); });
    if(f.dataset.id && orig !== date) mutDay(orig, d => { d.events = (d.events||[]).filter(e => e.id !== id); });
    save(date, ev);
    closeModal(); render();
    if(!GCal.mcp || (!push && !ev.gid)){ toast(f.dataset.id ? '일정을 수정했어요' : `${shortLabel(date)} 일정을 추가했어요`); return; }
    const cal = GCal.cal();
    try{
      if(push && ev.gid){
        await GCal.call('update_event', Object.assign({}, cal, gArgs(ev, date), { eventId:ev.gid, notificationLevel:'NONE' }));
        save(date, { gsync:'ok' }); toast('일정을 저장하고 구글 캘린더에도 반영했어요');
      } else if(push){
        toast('구글 캘린더로 보내는 중…');
        const p = await GCal.call('create_event', Object.assign({}, cal, gArgs(ev, date)));
        let gid = p && (p.id || (p.event && p.event.id) || p.eventId);
        if(!gid){ // fallback: find the event we just created
          try{ const q = await GCal.call('list_events', Object.assign({}, cal, { startTime:`${date}T00:00:00`, endTime:`${addDays(date,1)}T00:00:00`, fullText:ev.title, pageSize:10 }));
            const hit = ((q && q.events) || []).filter(x => x.summary === ev.title).pop(); gid = hit && hit.id; }catch(e){}
        }
        save(date, { gid:gid || null, gsync:gid ? 'ok' : 'unknown' });
        toast('일정을 저장하고 구글 캘린더에도 보냈어요');
      } else {
        await GCal.call('delete_event', Object.assign({}, cal, { eventId:ev.gid, notificationLevel:'NONE' }));
        save(date, { gid:null, gsync:null }); toast('구글 캘린더에서는 뺐어요. 웹앱에는 남아 있어요');
      }
      GCal.refreshAll();
    }catch(e){
      if(!ev.gid) save(date, { gsync:'failed' });
      toast(GCal.writeMsg(e)); render();
    }
  },
  'list-add': f => { const t = f.t.value.trim(), k = f.dataset.list; if(!t) return; Store.mutate('settings', s => { s[k] = s[k] || []; s[k].push({ id:uid(), text:t }); }); render(); focusForm('list-add', k); }
};
function focusSub(id){ const el = document.querySelector(`form[data-form="sub-add"][data-id="${id}"] input`); if(el) el.focus(); }
function focusForm(name, list){ const el = document.querySelector(`form[data-form="${name}"]${list ? `[data-list="${list}"]` : ''} input[type=text]`); if(el) el.focus(); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act; if(!actions[a]) return;
  if(el.tagName === 'A') e.preventDefault();
  if(el.type === 'checkbox'){ actions[a](el, e); return; }

});
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if(!f) return; e.preventDefault(); const fn = forms[f.dataset.form]; if(fn) fn(f); });
let mtgSearchTimer;
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset && t.dataset.actInput === 'memo-search'){ state.memoQ = t.value; clearTimeout(mtgSearchTimer); mtgSearchTimer = setTimeout(() => { const pos = t.selectionStart; render(); const n = document.querySelector('[data-act-input="memo-search"]'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } }, 250); return; }
  if(t.dataset && t.dataset.actInput === 'mtg-search'){ state.mtgQ = t.value; clearTimeout(mtgSearchTimer); mtgSearchTimer = setTimeout(() => { const pos = t.selectionStart; render(); const n = document.querySelector('[data-act-input="mtg-search"]'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } }, 250); return; }
  if(t.tagName === 'TEXTAREA') autosize(t);
  if(!t.dataset || !t.dataset.bind) return;
  const [doc, path] = t.dataset.bind.split('|');
  let v = t.type === 'number' ? (t.value === '' ? null : Number(t.value)) : t.value;
  Store.mutate(doc, d => { setPath(d, path, v); if(doc.startsWith('mtg-')) d.updatedAt = new Date().toISOString(); });
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset && t.dataset.actChange === 'pick-date' && t.value){ state.date = t.value; render(); return; }
  if(t.dataset && t.dataset.actChange === 'todo-move'){ moveTodo(t.dataset.id, t.value || null); return; }
  if(t.dataset && t.dataset.actChange === 'psel-color'){ t.className = 'psel p-' + t.value; return; }
  if(t.dataset && t.dataset.actChange === 'todo-prio'){ const v = t.value; t.className = 'psel p-' + v; mutTodos(items => { const x = items.find(y => y.id === t.dataset.id); if(x) x.priority = v; }); t.blur(); render(); return; }
  if(t.dataset && t.dataset.actChange === 'todo-status'){ const v = t.value; mutTodos(items => { const x = items.find(y => y.id === t.dataset.id); if(!x) return; x.status = v; x.done = v === 'done'; x.doneAt = x.done ? (x.doneAt || today()) : null; }); t.blur(); render(); return; }
  if(t.dataset && t.dataset.actChange === 'todo-kind'){ const f = t.form, k = t.value; if(!f) return; if(k === 'pick'){ Wheel.prep(); Wheel.open(f.d); } else { f.d.value = k ? (dueFor(k, today()) || '') : ''; } return; }
  if(t.dataset && t.dataset.actChange === 'gcal-pick'){ const c = (state.gcals||[]).find(x => x.id === t.value); Store.mutate('settings', s => { s.gcal = Object.assign({ show:true, push:true }, s.gcal || {}); s.gcal.calendarId = t.value; s.gcal.calendarName = c ? c.name : ''; }); GCal.byDate = {}; GCal.refreshAll(); return; }
  if(t.dataset && (t.dataset.rerender || t.tagName === 'SELECT') && t.dataset.bind) setTimeout(() => softRender(), 0);
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && document.querySelector('.modal-bg')) closeModal();
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.dataset && e.target.dataset.memoIn && e.target.form){ e.preventDefault(); e.target.form.requestSubmit(); }
});
/* 필수 기록 · 하루 회고 접기/펼치기 상태 기억 (toggle은 버블링되지 않아 캡처로 받아요) */
document.addEventListener('toggle', e => { const d = e.target; if(!d.classList || !d.classList.contains('recs')) return; state.recOpen = d.open; if(d.open) d.querySelectorAll('textarea').forEach(autosize); }, true);
/* 주간 일정: 끌어서 다른 날짜로 옮기기 */
let dragId = null;
const dropZone = e => e.target && e.target.closest ? e.target.closest('[data-drop]') : null;
document.addEventListener('dragstart', e => { const el = e.target.closest && e.target.closest('[data-drag]'); if(!el) return; dragId = el.dataset.drag; e.dataTransfer.effectAllowed = 'move'; try{ e.dataTransfer.setData('text/plain', dragId); }catch(_){} setTimeout(() => el.classList.add('dragging'), 0); });
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.dragging,.drop').forEach(x => x.classList.remove('dragging', 'drop')); });
document.addEventListener('dragover', e => { if(!dragId) return; const z = dropZone(e); if(!z) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; document.querySelectorAll('.drop').forEach(x => { if(x !== z) x.classList.remove('drop'); }); z.classList.add('drop'); });
document.addEventListener('dragleave', e => { const z = dropZone(e); if(z && !z.contains(e.relatedTarget)) z.classList.remove('drop'); });
document.addEventListener('drop', e => { const z = dropZone(e); if(!z || !dragId) return; e.preventDefault(); const id = dragId; dragId = null; moveTodo(id, z.dataset.drop || null); });
window.addEventListener('hashchange', render);
setInterval(() => {
  const c = document.getElementById('clock'); if(c){ const d = new Date(); c.textContent = `${d.getMonth()+1}월 ${d.getDate()}일 ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
  const el = document.getElementById('elapsed'); const d = dayDoc(today());
  if(el && d.inAt && !d.outAt) el.textContent = fmtMin(Math.max(0, toMin(nowHM()) - toMin(d.inAt)));
  const eta = document.getElementById('eta'); if(eta && d.inAt && !d.outAt && state.date === today()) eta.innerHTML = etaText(d.inAt);
}, 20000);
(function tick(){ const c = document.getElementById('clock'); const d = new Date(); if(c) c.textContent = `${d.getMonth()+1}월 ${d.getDate()}일 ${pad(d.getHours())}:${pad(d.getMinutes())}`; })();

/* ---------- wheel picker for date & time ---------- */
const IH = 44;
const Wheel = {
  input:null, bindKey:null, type:null, st:null, cols:[],
  prep(root){ (root || document).querySelectorAll('input[type=date],input[type=time]').forEach(i => { if(!i.readOnly){ i.readOnly = true; i.setAttribute('inputmode','none'); } }); },
  open(input){
    this.input = input; this.bindKey = input.dataset.bind || null; this.type = input.type;
    const v = input.value, now = new Date();
    if(this.type === 'date'){
      const base = v ? parse(v) : (state.route === 'today' && state.date ? parse(state.date) : now);
      this.st = { y: base.getFullYear(), m: base.getMonth()+1, d: base.getDate() };
    } else {
      let h, mi;
      if(v){ [h, mi] = v.split(':').map(Number); } else { h = now.getHours(); mi = Math.round(now.getMinutes()/5)*5; if(mi === 60){ mi = 55; } }
      this.st = { ap: h >= 12 ? 1 : 0, h: (h % 12) || 12, mi };
    }
    const slotK = input.closest('.slot') && input.closest('.slot').querySelector('.k');
    const th = input.closest('td') && input.closest('table') ? input.closest('table').querySelectorAll('th')[input.closest('td').cellIndex] : null;
    const lf = input.parentElement && input.parentElement.querySelector('label.f');
    const label = (slotK && slotK.childNodes[0].textContent) || (th && th.textContent) || (lf && lf.textContent) || input.title || (this.type === 'date' ? '날짜 선택' : '시간 선택');
    const quick = this.type === 'date'
      ? `<button class="btn sm" data-wq="today">오늘</button><button class="btn sm" data-wq="tomorrow">내일</button><button class="btn sm" data-wq="fri">이번 주 금</button><button class="btn sm" data-wq="nextmon">다음 주 월</button>`
      : `<button class="btn sm" data-wq="now">지금</button><button class="btn sm" data-wq="0900">09:00</button><button class="btn sm" data-wq="1200">12:00</button><button class="btn sm" data-wq="1800">18:00</button>`;
    document.getElementById('pickRoot').innerHTML = `<div class="wheel-bg" data-wbg="1"><div class="wheel" role="dialog" aria-label="${this.type === 'date' ? '날짜' : '시간'} 선택">
      <div class="wlabel">${esc(label.trim())}</div><div class="wprev num" id="wprev"></div>
      <div class="wcols" id="wcols"></div>
      <div class="wquick">${quick}${input.required ? '' : '<button class="btn sm ghost" data-wq="clear">지우기</button>'}</div>
      <div class="wactions"><button class="btn" data-wa="cancel">취소</button><button class="btn pri" data-wa="ok">확인</button></div></div></div>`;
    this.build();
  },
  colsDef(){
    if(this.type === 'date'){
      const cy = new Date().getFullYear(), y0 = Math.min(cy - 3, this.st.y), y1 = Math.max(cy + 3, this.st.y);
      const years = []; for(let y = y0; y <= y1; y++) years.push({ v:y, l:`${y}년` });
      const months = Array.from({length:12}, (_,i) => ({ v:i+1, l:`${i+1}월` }));
      const dim = new Date(this.st.y, this.st.m, 0).getDate(); if(this.st.d > dim) this.st.d = dim;
      const days = Array.from({length:dim}, (_,i) => ({ v:i+1, l:`${i+1}일` }));
      return [['y', years, ''], ['m', months, 'narrow'], ['d', days, 'narrow']];
    }
    const mins = []; for(let m = 0; m < 60; m += 5) mins.push(m);
    if(!mins.includes(this.st.mi)){ mins.push(this.st.mi); mins.sort((a,b) => a-b); }
    return [['ap', [{v:0,l:'오전'},{v:1,l:'오후'}], 'narrow'], ['h', Array.from({length:12}, (_,i) => ({ v:i+1, l:`${i+1}시` })), ''], ['mi', mins.map(m => ({ v:m, l:`${pad(m)}분` })), '']];
  },
  build(){
    const wrap = document.getElementById('wcols'); if(!wrap) return;
    this.cols = this.colsDef();
    wrap.innerHTML = this.cols.map(([k, items, cls]) => `<div class="wcol ${cls}" data-k="${k}">${items.map((it,i) => `<div class="wi" data-i="${i}">${it.l}</div>`).join('')}</div>`).join('');
    wrap.querySelectorAll('.wcol').forEach((col, ci) => {
      const [k, items] = this.cols[ci];
      const idx = Math.max(0, items.findIndex(it => it.v === this.st[k]));
      col.scrollTop = idx * IH; this.mark(col, idx);
      let t; col.addEventListener('scroll', () => { clearTimeout(t); this.mark(col, Math.round(col.scrollTop / IH)); t = setTimeout(() => this.settle(col, ci), 110); }, { passive:true });
      col.addEventListener('click', e => { const it = e.target.closest('.wi'); if(it) col.scrollTo({ top: Number(it.dataset.i) * IH, behavior:'smooth' }); });
    });
    this.preview();
  },
  mark(col, idx){ col.querySelectorAll('.wi.sel').forEach(x => x.classList.remove('sel')); const it = col.children[idx]; if(it) it.classList.add('sel'); },
  settle(col, ci){
    if(!col.isConnected || this.cols[ci] === undefined || col.dataset.k !== this.cols[ci][0]) return;
    const [k, items] = this.cols[ci]; const idx = Math.min(items.length - 1, Math.max(0, Math.round(col.scrollTop / IH)));
    const prev = this.st[k]; this.st[k] = items[idx].v;
    if(this.type === 'date' && (k === 'y' || k === 'm') && prev !== this.st[k]){
      const dim = new Date(this.st.y, this.st.m, 0).getDate(), dcol = document.querySelector('.wcol[data-k=d]');
      if(dcol && dcol.children.length !== dim){ if(this.st.d > dim) this.st.d = dim; this.build(); return; }
    }
    this.preview();
  },
  value(){
    if(this.type === 'date') return `${this.st.y}-${pad(this.st.m)}-${pad(this.st.d)}`;
    const h24 = (this.st.h % 12) + (this.st.ap ? 12 : 0); return `${pad(h24)}:${pad(this.st.mi)}`;
  },
  preview(){ const el = document.getElementById('wprev'); if(!el) return;
    el.textContent = this.type === 'date' ? dayLabel(this.value()).replace(/^/, `${this.st.y}년 `) : `${this.st.ap ? '오후' : '오전'} ${this.st.h}:${pad(this.st.mi)}`; },
  jump(v){ // set state from a value and rebuild
    if(this.type === 'date'){ const d = parse(v); this.st = { y:d.getFullYear(), m:d.getMonth()+1, d:d.getDate() }; }
    else { const [h, mi] = v.split(':').map(Number); this.st = { ap: h >= 12 ? 1 : 0, h: (h % 12) || 12, mi }; }
    this.build();
  },
  target(){ if(this.input && this.input.isConnected) return this.input; if(this.bindKey) return document.querySelector(`[data-bind="${CSS.escape(this.bindKey)}"]`); return null; },
  commit(v){
    const el = this.target(); this.close(false);
    if(!el) return;
    el.value = v; el.dispatchEvent(new Event('input', { bubbles:true })); el.dispatchEvent(new Event('change', { bubbles:true }));
    if(state.pendingRender) setTimeout(() => softRender(), 0);
  },
  close(rerender = true){ document.getElementById('pickRoot').innerHTML = ''; this.input = null; if(rerender && state.pendingRender) setTimeout(() => softRender(), 0); }
};
document.addEventListener('click', e => {
  const inp = e.target.closest && e.target.closest('input[type=date],input[type=time]');
  if(inp && !inp.disabled){ e.preventDefault(); e.stopPropagation(); Wheel.prep(); Wheel.open(inp); return; }
  if(!document.querySelector('.wheel-bg')) return;
  const q = e.target.closest('[data-wq]'), a = e.target.closest('[data-wa]');
  if(q){ const k = q.dataset.wq, t = today();
    if(k === 'clear') return Wheel.commit('');
    if(k === 'today') return Wheel.jump(t);
    if(k === 'tomorrow') return Wheel.jump(addDays(t,1));
    if(k === 'fri') return Wheel.jump(weekDue(t));
    if(k === 'nextmon'){ const d = parse(t); const add = ((8 - d.getDay()) % 7) || 7; return Wheel.jump(addDays(t, add)); }
    if(k === 'now'){ return Wheel.jump(nowHM()); }
    return Wheel.jump(k.slice(0,2) + ':' + k.slice(2));
  }
  if(a){ if(a.dataset.wa === 'ok') Wheel.commit(Wheel.value()); else Wheel.close(); return; }
  if(e.target.dataset && e.target.dataset.wbg) Wheel.close();
}, true);
document.addEventListener('keydown', e => {
  if(document.querySelector('.wheel-bg')){ if(e.key === 'Escape'){ e.stopPropagation(); Wheel.close(); } else if(e.key === 'Enter'){ e.preventDefault(); Wheel.commit(Wheel.value()); } return; }
  const t = e.target; if(t && t.matches && t.matches('input[type=date],input[type=time]') && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); Wheel.prep(); Wheel.open(t); }
}, true);
new MutationObserver(() => Wheel.prep()).observe(document.body, { childList:true, subtree:true });
Wheel.prep();

Store.init().then(() => GCal.init());
if(!window.claude && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
setInterval(() => { if(document.visibilityState === 'visible' && GCal.enabled()) softRender(); }, 5*60e3);
})();
